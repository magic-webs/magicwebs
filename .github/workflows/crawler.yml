name: Crawler

on:
  push:
    branches: [main]
    paths:
      - apps/crawler/**
      - packages/backend/**
      - packages/page-schema/**
      - package.json
      - bun.lock
      - tsconfig.base.json
      - .github/workflows/crawler.yml
  pull_request:
    paths:
      - apps/crawler/**
      - packages/backend/**
      - packages/page-schema/**
      - package.json
      - bun.lock
      - tsconfig.base.json
      - .github/workflows/crawler.yml
  workflow_dispatch:
    inputs:
      tag:
        description: Commit SHA of an earlier image to redeploy (rollback). Leave empty to build and deploy the selected branch.
        required: false
        default: ""

permissions:
  contents: read

env:
  IMAGE: ghcr.io/magic-webs/magicwebs-crawler

jobs:
  check:
    if: ${{ !inputs.tag }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run --filter @magicwebs/crawler typecheck

  build:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/crawler/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha,scope=crawler
          cache-to: type=gha,scope=crawler,mode=max

  deploy:
    needs: build
    # Runs after a successful build, or on its own for a rollback to an existing tag.
    if: >-
      ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' &&
      (needs.build.result == 'success' || (needs.build.result == 'skipped' && inputs.tag)) }}
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: crawler-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      TAG: ${{ inputs.tag || github.sha }}
      DEPLOY_DIR: /opt/magicwebs/crawler
      TARGET: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Upload compose file
        run: scp apps/crawler/docker-compose.prod.yml "$TARGET:$DEPLOY_DIR/docker-compose.yml"

      - name: Log the VPS into GHCR
        # The job token expires when this job ends; the deploy logs out again below.
        run: echo "${{ secrets.GITHUB_TOKEN }}" | ssh "$TARGET" docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull and restart
        run: |
          ssh "$TARGET" "TAG=$TAG DEPLOY_DIR=$DEPLOY_DIR bash -s" <<'EOF'
          set -euo pipefail
          cd "$DEPLOY_DIR"
          trap 'docker logout ghcr.io >/dev/null' EXIT
          if [ ! -s crawler.env ]; then
            echo "::error::$DEPLOY_DIR/crawler.env is missing on the VPS. See apps/crawler/DEPLOY.md."
            exit 1
          fi
          echo "CRAWLER_TAG=$TAG" > .env
          docker compose pull
          docker compose up -d --remove-orphans
          echo "Waiting for the workers to settle..."
          sleep 30
          docker compose ps
          bad=$(docker compose ps -a --format '{{.State}}' | grep -cv '^running$' || true)
          if [ "$bad" -gt 0 ]; then
            docker compose logs --tail 80
            echo "::error::$bad crawler container(s) are not running"
            exit 1
          fi
          docker compose logs --tail 20
          docker image prune -af --filter "until=72h" >/dev/null
          EOF
