# Shared pipeline for the services that run on the VPS: typecheck, build the
# image to GHCR, then upload deploy/<service>/ to /opt/magicwebs/<service> and
# restart it with docker compose. Called by crawler.yml and api.yml.
name: Deploy to VPS

on:
  workflow_call:
    inputs:
      service:
        description: Folder under deploy/ and /opt/magicwebs/, and the image name suffix
        type: string
        required: true
      package:
        description: Workspace package to typecheck
        type: string
        required: true
      dockerfile:
        type: string
        required: true
      tag:
        description: Existing image tag to redeploy (rollback); empty builds this commit
        type: string
        default: ""

jobs:
  check:
    if: ${{ !inputs.tag }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run --filter ${{ inputs.package }} typecheck

  build:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          push: true
          tags: |
            ghcr.io/magic-webs/magicwebs-${{ inputs.service }}:${{ github.sha }}
            ghcr.io/magic-webs/magicwebs-${{ inputs.service }}:latest
          cache-from: type=gha,scope=${{ inputs.service }}
          cache-to: type=gha,scope=${{ inputs.service }},mode=max

  deploy:
    needs: build
    # Runs after a successful build, or on its own for a rollback to an existing tag.
    if: >-
      ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' &&
      (needs.build.result == 'success' || (needs.build.result == 'skipped' && inputs.tag)) }}
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-${{ inputs.service }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      SERVICE: ${{ inputs.service }}
      TAG: ${{ inputs.tag || github.sha }}
      DEPLOY_DIR: /opt/magicwebs/${{ inputs.service }}
      TARGET: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Upload deploy files
        run: scp deploy/$SERVICE/* "$TARGET:$DEPLOY_DIR/"

      - name: Log the VPS into GHCR
        # The job token expires when this job ends; the deploy logs out again below.
        run: echo "${{ secrets.GITHUB_TOKEN }}" | ssh "$TARGET" docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull and restart
        run: |
          ssh "$TARGET" "SERVICE=$SERVICE TAG=$TAG DEPLOY_DIR=$DEPLOY_DIR bash -s" <<'EOF'
          set -euo pipefail
          cd "$DEPLOY_DIR"
          trap 'docker logout ghcr.io >/dev/null' EXIT
          if [ ! -s "$SERVICE.env" ]; then
            echo "::error::$DEPLOY_DIR/$SERVICE.env is missing on the VPS. See deploy/README.md."
            exit 1
          fi
          echo "IMAGE_TAG=$TAG" > .env
          docker compose pull
          docker compose up -d --remove-orphans
          # A changed Caddyfile is a bind mount, so the running Caddy has to be told to reload it.
          if docker compose config --services | grep -qx caddy; then
            docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile
          fi
          echo "Waiting for the containers to settle..."
          sleep 30
          docker compose ps
          bad=$(docker compose ps -a --format '{{.State}} {{.Health}}' | grep -cvE '^running( healthy)? *$' || true)
          if [ "$bad" -gt 0 ]; then
            docker compose logs --tail 80
            echo "::error::$bad $SERVICE container(s) are not running and healthy"
            exit 1
          fi
          docker compose logs --tail 20
          docker image prune -af --filter "until=72h" >/dev/null
          EOF
