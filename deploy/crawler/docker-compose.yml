# Crawler workers on the VPS, at /opt/magicwebs/crawler. Deployed by
# .github/workflows/crawler.yml, which uploads this folder.
#
#   .env          IMAGE_TAG=<commit sha>, written by each deploy
#   crawler.env   the crawler's secrets, kept only on the VPS
#
# Workers pull jobs from Convex and open no ports, so scaling is raising `replicas`.
name: magicwebs-crawler

services:
  crawler:
    image: ghcr.io/magic-webs/magicwebs-crawler:${IMAGE_TAG:-latest}
    env_file: crawler.env
    restart: unless-stopped
    init: true
    ipc: host
    # A worker finishes its current job after SIGTERM before exiting.
    stop_grace_period: 5m
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 2g
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"
