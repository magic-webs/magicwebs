name: Crawler

on:
  push:
    branches: [main]
    paths:
      - apps/crawler/**
      - deploy/crawler/**
      - packages/backend/**
      - packages/page-schema/**
      - package.json
      - bun.lock
      - tsconfig.base.json
      - .github/workflows/crawler.yml
      - .github/workflows/deploy-vps.yml
  pull_request:
    paths:
      - apps/crawler/**
      - deploy/crawler/**
      - packages/backend/**
      - packages/page-schema/**
      - package.json
      - bun.lock
      - tsconfig.base.json
      - .github/workflows/crawler.yml
      - .github/workflows/deploy-vps.yml
  workflow_dispatch:
    inputs:
      tag:
        description: Commit SHA of an earlier image to redeploy (rollback). Leave empty to build and deploy the selected branch.
        required: false
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  pipeline:
    uses: ./.github/workflows/deploy-vps.yml
    with:
      service: crawler
      package: "@magicwebs/crawler"
      dockerfile: apps/crawler/Dockerfile
      tag: ${{ inputs.tag || '' }}
    secrets: inherit
